name: Check directory
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check site/request.js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: directory-preview
          path: dist
