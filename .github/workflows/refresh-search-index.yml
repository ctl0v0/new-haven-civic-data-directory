name: Refresh private parcel search index
# Updating this workflow on main refreshes every cataloged municipal permit type.
# This refresh retains published vendor Parcel_ID and PrintKey_Parcel for linkage audit.
# Hourly runs refresh one stable type shard; the daily run refreshes City and State baselines.
on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-search-index.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: Which official source refresh to run
        required: true
        type: choice
        options: [daily, hourly, municipal]
  schedule:
    - cron: '17 * * * *'
    - cron: '47 7 * * *'
permissions:
  contents: read
concurrency:
  group: private-parcel-search-index
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/parcel-pilot
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check Neon writer connection without importing data
        env:
          SEARCH_DATABASE_WRITE_URL: ${{ secrets.SEARCH_DATABASE_WRITE_URL }}
        run: npm run index:verify-writer
  refresh:
    if: vars.PARCEL_INDEX_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Select refresh mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$SCHEDULE" = '17 * * * *' ]; then
            mode=hourly
          elif [ "$SCHEDULE" = '47 7 * * *' ]; then
            mode=daily
          elif [ "$EVENT_NAME" = push ]; then
            mode=municipal
          else
            mode="$REQUESTED_MODE"
          fi
          case "$mode" in daily|hourly|municipal) ;; *) exit 1 ;; esac
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: codex/parcel-pilot
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate private index revision
        run: |
          git rev-parse --short=12 HEAD
          npm test
      - name: Migrate and verify read-only access
        env:
          SEARCH_DATABASE_WRITE_URL: ${{ secrets.SEARCH_DATABASE_WRITE_URL }}
          SEARCH_DATABASE_READER_PASSWORD: ${{ secrets.SEARCH_DATABASE_READER_PASSWORD }}
          SEARCH_DATABASE_READER_ROLE: ${{ vars.SEARCH_DATABASE_READER_ROLE || 'search_index_reader' }}
        run: |
          test -n "$SEARCH_DATABASE_WRITE_URL" || { echo 'SEARCH_DATABASE_WRITE_URL is missing'; exit 1; }
          npm run index:migrate
          npm run index:grant-reader
      - name: Refresh official sources
        env:
          SEARCH_DATABASE_WRITE_URL: ${{ secrets.SEARCH_DATABASE_WRITE_URL }}
          SEARCH_DATABASE_READER_PASSWORD: ${{ secrets.SEARCH_DATABASE_READER_PASSWORD }}
          SEARCH_DATABASE_READER_ROLE: ${{ vars.SEARCH_DATABASE_READER_ROLE || 'search_index_reader' }}
          REFRESH_MODE: ${{ steps.mode.outputs.value }}
        run: |
          set +e
          npm run index:refresh:all -- "$REFRESH_MODE"
          refresh_status=$?
          set -e
          if [ "$REFRESH_MODE" = daily ] && [ "$refresh_status" -eq 0 ]; then npm run index:prune; fi
          if [ "$REFRESH_MODE" != daily ]; then npm run index:smoke; fi
          exit "$refresh_status"
