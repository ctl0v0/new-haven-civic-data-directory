name: Audit unmatched recent Electrical parcel keys
on:
  push:
    branches: [codex/parcel-pilot]
    paths: [.github/workflows/audit-recent-permit-parent-keys.yml, scripts/audit-recent-permit-parent-keys.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/parcel-pilot
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect official parcel keys with read-only database access
        env:
          SEARCH_DATABASE_WRITE_URL: ${{ secrets.SEARCH_DATABASE_WRITE_URL }}
          SEARCH_DATABASE_READER_PASSWORD: ${{ secrets.SEARCH_DATABASE_READER_PASSWORD }}
          SEARCH_DATABASE_READER_ROLE: ${{ vars.SEARCH_DATABASE_READER_ROLE || 'search_index_reader' }}
        run: node scripts/audit-recent-permit-parent-keys.mjs
