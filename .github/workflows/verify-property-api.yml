name: Verify property APIs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/verify-property-api.mjs
      - .github/workflows/verify-property-api.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public API metadata and one record per service
        run: node scripts/verify-property-api.mjs
