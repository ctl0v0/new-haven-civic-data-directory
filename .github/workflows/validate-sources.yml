name: Validate civic sources
on:
  workflow_dispatch:
    inputs:
      source:
        description: Source checks to run
        type: choice
        default: all
        options: [all, alders, property, finance]
  schedule:
    - cron: '0 14 * * 1'
  push:
    branches: [main]
    paths: ['scripts/validate-sources.mjs', 'scripts/verify-alders.py', 'scripts/verify-property-api.mjs', 'scripts/verify-property-lookup.mjs', 'scripts/verify-gis-workflow.mjs', 'scripts/publish-source-checks.mjs', 'scripts/review-source-changes.mjs', 'scripts/discover-wards.mjs', 'scripts/verify-finance.py', 'validation/**', '.github/workflows/validate-sources.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/discover-wards.mjs
      - run: python3 -m pip install pypdf==5.9.0
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node scripts/validate-sources.mjs "${{ inputs.source || 'all' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-validation
          path: verification/
          retention-days: 7

  publish:
    concurrency:
      group: source-check-publication
      cancel-in-progress: false
    needs: validate
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: source-validation
          path: verification/
      - run: node scripts/publish-source-checks.mjs
      - name: Review changed source findings
        run: node scripts/review-source-changes.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save public check summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/source-checks.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update latest source validation results"
          git push origin HEAD:main
