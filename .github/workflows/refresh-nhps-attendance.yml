name: Refresh NHPS attendance zones
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-nhps-attendance.yml]
  schedule:
    - cron: '20 13 * * 1'
permissions:
  contents: write
concurrency:
  group: refresh-nhps-attendance
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/parcel-pilot
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/refresh-nhps-attendance.py
      - run: npm ci
      - run: npm test
      - name: Publish verified official snapshot to the private preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nhps-attendance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh official NHPS attendance-zone table"
          git push origin HEAD:codex/parcel-pilot
